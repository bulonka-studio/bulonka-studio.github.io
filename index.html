<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bulonka Studio — Privacy-first mobile apps</title>
    <meta name="description" content="A small studio building privacy-first iOS and Android apps end-to-end, plus privacy engineering and app testing for existing apps." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://bulonka-studio.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bulonka Studio — Privacy-first mobile apps" />
    <meta property="og:description" content="A small studio building privacy-first iOS and Android apps end-to-end, plus privacy engineering and app testing for existing apps." />
    <meta property="og:url" content="https://bulonka-studio.com/" />
    <meta property="og:image" content="https://bulonka-studio.com/bulonka-studio-preview.png" />

    <meta name="theme-color" content="#0F0E13" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBFAFC" media="(prefers-color-scheme: light)" />

    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme');
          if (s !== 'dark' && s !== 'light') {
            s = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', s);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Bulonka Studio",
        "url": "https://bulonka-studio.com",
        "description": "Privacy-first mobile app development studio focused on iOS and Android.",
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "yholiakh@gmail.com",
          "contactType": "customer service"
        }
      }
    </script>
  </head>

  </body>
