<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Bulonka Studio</title>
    <meta name="description" content="Email is the only way in — no forms, no calendars, no third parties. Reply usually within one business day." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://bulonka-studio.com/contact/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contact — Bulonka Studio" />
    <meta property="og:description" content="Email is the only way in — no forms, no calendars, no third parties. Reply usually within one business day." />
    <meta property="og:url" content="https://bulonka-studio.com/contact/" />
    <meta property="og:image" content="https://bulonka-studio.com/bulonka-studio-preview.png" />

    <meta name="theme-color" content="#0F0E13" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBFAFC" media="(prefers-color-scheme: light)" />

    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme');
          if (s !== 'dark' && s !== 'light') {
            s = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', s);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/entries/contact.js"></script>
  </body>
</html>
